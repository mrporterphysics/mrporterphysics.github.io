<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="Nunito, system-ui, sans-serif">
  <!-- major axis -->
  <line x1="60" y1="170" x2="560" y2="170" stroke="#AFAFAF" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- orbit -->
  <ellipse cx="310" cy="170" rx="240" ry="130" fill="none" stroke="#1CB0F6" stroke-width="4"/>
  <!-- d : distance between the foci -->
  <line x1="160" y1="135" x2="460" y2="135" stroke="#FF9600" stroke-width="2.5"/>
  <line x1="160" y1="127" x2="160" y2="143" stroke="#FF9600" stroke-width="2.5"/>
  <line x1="460" y1="127" x2="460" y2="143" stroke="#FF9600" stroke-width="2.5"/>
  <text x="310" y="124" fill="#E08600" font-size="22" font-weight="700" text-anchor="middle">d</text>
  <!-- L : length of the major axis -->
  <line x1="70" y1="345" x2="550" y2="345" stroke="#8B2FC9" stroke-width="2.5"/>
  <line x1="70" y1="337" x2="70" y2="353" stroke="#8B2FC9" stroke-width="2.5"/>
  <line x1="550" y1="337" x2="550" y2="353" stroke="#8B2FC9" stroke-width="2.5"/>
  <text x="310" y="334" fill="#8B2FC9" font-size="22" font-weight="700" text-anchor="middle">L</text>
  <!-- foci -->
  <circle cx="160" cy="170" r="16" fill="#FFC800" stroke="#E6A100" stroke-width="3"/>
  <circle cx="460" cy="170" r="7" fill="#FFFFFF" stroke="#777777" stroke-width="2.5"/>
  <text x="160" y="212" fill="#3C3C3C" font-size="18" font-weight="700" text-anchor="middle">Sun (focus 1)</text>
  <text x="460" y="212" fill="#777777" font-size="18" text-anchor="middle">focus 2 (empty)</text>
  <!-- planet -->
  <circle cx="448" cy="64" r="11" fill="#2B7A0A"/>
  <text x="448" y="42" fill="#2B7A0A" font-size="18" font-weight="700" text-anchor="middle">planet</text>
  <text x="310" y="392" fill="#777777" font-size="17" text-anchor="middle">major axis measured end to end</text>
</svg>
