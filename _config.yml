markdown: kramdown
theme: minima
title: Physics with Mr. Porter
description: This website is designed to host resources for Mr. Porter's Physics Classes
baseurl: ""
breadcrumbs: true
twitter:
  username: "mrporterphysics"
email: nporter@schodack.k12.ny.us
# NOTE: header_pages is DEAD CONFIG. It is a minima-theme key, but this repo
# overrides minima's _includes/header.html with its own hard-coded nav, which never
# reads site.header_pages. Editing this list changes nothing on the site --
# edit _includes/header.html instead. Kept only as a record of the intended top-level set.
header_pages:
  - index.md
  - courses/ap-physics.md
  - courses/regents-physics.md
  - courses/earth-science.md
  - presindex.md
  - contact.md
# plugins:
#   - jekyll-paginate-v2
#   - jekyll-sitemap
#   - jekyll-include-cache
# Marp slide sources (*.md with `marp: true`) carry YAML front matter, so Jekyll
# would otherwise render them as flat pages -- slide separators become <hr> and
# students see an unstyled wall of text at the same URL as the real deck.
# This suppresses the sources only. The exported .html files have no front matter,
# so Jekyll treats them as static files and they are unaffected.
# NOTE: do not use `exclude:` here -- that drops static files too and would
# remove every exported deck from the site.
defaults:
  - scope:
      path: "Presentations"
    values:
      published: false
  - scope:
      path: "Daily Plan"
    values:
      published: false
