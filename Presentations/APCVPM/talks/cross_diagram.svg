<text x="310" y="330" font-size="17" fill="#48484a" text-anchor="middle">Five quantities describe any constant-acceleration motion.</text>
<text x="310" y="358" font-size="17" fill="#1c1c1e" text-anchor="middle" font-weight="700">Every kinematic equation uses exactly four of them.</text>
