<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="480" fill="none"/>
<defs><g id="car">
<circle cx="-7.5" cy="-3.5" r="3" fill="#48484a"/>
<circle cx="7.5" cy="-3.5" r="3" fill="#48484a"/>
<rect x="-13" y="-11" width="26" height="7.5" rx="2" fill="#d63031"/>
<path d="M -6.5,-11 L -4,-17 L 6,-17 L 8,-11 Z" fill="#d63031"/>
</g></defs>
<text x="40" y="34" font-size="16" fill="#48484a">A poorly tuned car accelerates <tspan font-weight="700">from rest</tspan> to <tspan font-weight="700">28 m/s</tspan> in <tspan font-weight="700">20 s</tspan>. Find the acceleration, and how far it travels.</text>
<text x="40" y="82" font-size="19" fill="#1c1c1e" font-weight="700">Sketch</text>
<line x1="300" y1="150" x2="455" y2="150" stroke="#d63031" stroke-width="4" stroke-linecap="round"/>
<polygon points="468,150 452,142 452,158" fill="#d63031"/>
<text x="378" y="136" font-size="18" fill="#d63031" text-anchor="middle" font-weight="700">a = ?</text>
<text x="378" y="176" font-size="14" fill="#8e8e93" text-anchor="middle">constant, in the direction of motion</text>
<text x="390" y="226" font-size="14" fill="#8e8e93" text-anchor="middle">equal time steps &#8212; the gaps grow, so it is speeding up</text>
<circle cx="130.0" cy="252.0" r="5.5" fill="#1c1c1e"/>
<circle cx="150.8" cy="252.0" r="5.5" fill="#1c1c1e"/>
<circle cx="213.2" cy="252.0" r="5.5" fill="#1c1c1e"/>
<circle cx="317.2" cy="252.0" r="5.5" fill="#1c1c1e"/>
<circle cx="462.8" cy="252.0" r="5.5" fill="#1c1c1e"/>
<circle cx="650.0" cy="252.0" r="5.5" fill="#1c1c1e"/>
<line x1="130" y1="320.0" x2="130" y2="333.0" stroke="#1c1c1e" stroke-width="2.5"/>
<line x1="650" y1="320.0" x2="650" y2="333.0" stroke="#1c1c1e" stroke-width="2.5"/>
<line x1="70" y1="320.0" x2="710" y2="320.0" stroke="#1c1c1e" stroke-width="2.5"/>
<polygon points="722,320.0 708,314.0 708,326.0" fill="#1c1c1e"/>
<text x="726" y="326.0" font-size="15" fill="#48484a">+x</text>
<use href="#car" transform="translate(130,320.0) scale(1.7)"/>
<use href="#car" transform="translate(650,320.0) scale(1.7)"/>
<text x="130" y="356.0" font-size="15" fill="#48484a" text-anchor="middle">x<tspan dy="4" font-size="10">0</tspan><tspan dy="-4" font-size="15"> = 0</tspan></text>
<text x="650" y="356.0" font-size="15" fill="#d63031" text-anchor="middle" font-weight="700">x<tspan dy="4" font-size="10">f</tspan><tspan dy="-4" font-size="15"> = ?</tspan></text>
<text x="70" y="404" font-size="16" fill="#1c1c1e" font-weight="700">initial</text>
<text x="70" y="428" font-size="16" fill="#48484a">t<tspan dy="4" font-size="10">0</tspan><tspan dy="-4" font-size="16"> = 0 s</tspan></text>
<text x="70" y="452" font-size="16" fill="#48484a">v<tspan dy="4" font-size="10">0</tspan><tspan dy="-4" font-size="16"> = 0 m/s</tspan></text>
<text x="560" y="404" font-size="16" fill="#1c1c1e" font-weight="700">final</text>
<text x="560" y="428" font-size="16" fill="#48484a">t<tspan dy="4" font-size="10">f</tspan><tspan dy="-4" font-size="16"> = 20 s</tspan></text>
<text x="560" y="452" font-size="16" fill="#48484a">v<tspan dy="4" font-size="10">f</tspan><tspan dy="-4" font-size="16"> = 28 m/s</tspan></text>
<line x1="770" y1="70" x2="770" y2="462" stroke="#e5e5ea" stroke-width="2"/>
<text x="810" y="82" font-size="19" fill="#1c1c1e" font-weight="700">Translate</text>
<text x="870" y="130" font-size="17" fill="#48484a" text-anchor="middle" font-weight="700">known</text>
<text x="1080" y="130" font-size="17" fill="#48484a" text-anchor="middle" font-weight="700">unknown</text>
<line x1="810" y1="146" x2="1150" y2="146" stroke="#1c1c1e" stroke-width="2.5"/>
<line x1="975" y1="104" x2="975" y2="356" stroke="#1c1c1e" stroke-width="2.5"/>
<text x="830" y="190" font-size="18" fill="#1c1c1e">&#916;t = 20 s</text>
<text x="830" y="234" font-size="18" fill="#1c1c1e">v<tspan dy="5" font-size="12">f</tspan><tspan dy="-5" font-size="18"> = 28 m/s</tspan></text>
<text x="830" y="278" font-size="18" fill="#1c1c1e">v<tspan dy="5" font-size="12">0</tspan><tspan dy="-5" font-size="18"> = 0 m/s</tspan></text>
<text x="1000" y="190" font-size="18" fill="#d63031" font-weight="700">a = ?</text>
<text x="1000" y="234" font-size="18" fill="#d63031" font-weight="700">&#916;x = ?</text>
<text x="810" y="418" font-size="15" fill="#48484a">&#8220;from rest&#8221; is data:</text>
<text x="810" y="444" font-size="15" fill="#d63031" font-weight="700">it tells you v<tspan dy="4" font-size="10">0</tspan><tspan dy="-4" font-size="15"> = 0.</tspan></text>
</svg>
