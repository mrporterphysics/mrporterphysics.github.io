<p>Don't. A single ratio has three problems:</p>
<ul>
<li>It rests on <strong>two</strong> measurements — you took <strong>forty</strong></li>
<li>It <strong>assumes</strong> the line goes through the origin. It can't check</li>
<li>One misread apex moves it a lot. One bad point barely tilts a line</li>
</ul>
<blockquote>
<p>The graph is how you spend all your data at once.</p>
</blockquote>

<h2 id="drawing-the-best-fit-line">Drawing the Best-Fit Line</h2>
<ul>
<li>Plot <strong>mean</strong> bounce height vs. drop height</li>
<li><strong>Do not connect the dots</strong> — you're not tracing, you're modeling</li>
<li>One straight line, roughly as many points <strong>above</strong> as <strong>below</strong></li>
<li>Extend it across the full range</li>
</ul>

<h2 id="then-test-it">Then Test It</h2>
<p>Write the prediction <strong>before</strong> you drop the ball. Then run five trials.</p>
<ul>
<li><strong>Lands inside your range</strong> → your model works, <em>and</em> your uncertainty was honest</li>
<li><strong>Lands just outside</strong> → you were probably too confident — your range was too narrow</li>
<li><strong>Lands far outside</strong> → something is wrong with the model, not the arithmetic</li>
</ul>
<blockquote>
<p>A prediction written <em>after</em> the measurement tests nothing at all.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="perspective" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:perspective;" data-marpit-pagination-total="15">
<h2 id="two-kinds-of-error">Two Kinds of Error</h2>
<p><strong>Random</strong> — scatter, different every time</p>
<ul>
<li>Misjudging the apex, slight release differences</li>
<li>More trials and averaging <strong>shrink</strong> it</li>
</ul>
<p><strong>Systematic</strong> — same direction every time</p>
<ul>
<li>Measuring drop to the ball's bottom but bounce to its top</li>
<li>Averaging <strong>does nothing</strong>. A thousand trials stay wrong</li>
</ul>
<blockquote>
<p>Only one of these is fixed by working harder. The other is fixed by thinking harder.</p>
</blockquote>
</section>
