<header>Topographic Mapping</header>

<h1 id="why-maps-have-lines-on-them">Why maps have lines on them</h1>
<ul>
<li>A topographic map shows a <strong>three-dimensional</strong> landscape on a <strong>two-dimensional</strong> sheet of paper</li>
<li>Slice the mountain at even elevations, look straight down at the slices, and you get <strong>contour lines</strong></li>
<li>Each line traces one elevation all the way around the landform</li>
</ul>
<p><img src="images/mountain-contours.png" alt="" style="width:520px;" /></p>

<header>Topographic Mapping</header>
<h1 id="mapping-the-earth-terms">Mapping the Earth: terms</h1>
<ul>
<li><strong>Field</strong> — any region of space that has a measurable value of a given quantity at every point</li>
<li><strong>Isoline</strong> — a line connecting points of <strong>equal value</strong></li>
<li><strong>Isotherm</strong> — a line connecting points of equal <strong>temperature</strong></li>
<li><strong>Isobar</strong> — a line connecting points of equal <strong>pressure</strong></li>
<li><strong>Contour line</strong> — a line connecting points of equal <strong>elevation</strong></li>
</ul>
<blockquote>
<p><em>Iso-</em> means &quot;equal.&quot; Change the ending, change the quantity being mapped — the rules for drawing the lines never change.</p>
</blockquote>

<h1 id="how-to-draw-an-isoline">How to draw an isoline</h1>
<ol>
<li>Connect dots of <strong>equal value</strong>, using the interval stated in the directions</li>

<header>Topographic Mapping</header>
<h1 id="rules-isolines-never-break">Rules isolines never break</h1>
<ul>
<li>Isolines <strong>never cross</strong> each other — one point can't have two values</li>
<li>Isolines <strong>never split</strong> or branch</li>
<li>Isolines close into loops or run off the edge of the map</li>
<li>Values change <strong>in order</strong> — you can't skip from 40 to 60 without a 50 in between</li>
<li>Lines <strong>close together</strong> = value changing quickly</li>
<li>Lines <strong>far apart</strong> = value changing slowly</li>
</ul>
</section>

<h1 id="round-out-your-peaks">Round out your peaks</h1>
<ul>
<li>The land keeps rising past the last contour line you crossed, so a hilltop is <strong>rounded</strong>, not pointed</li>
<li>Valley bottoms get rounded for the same reason</li>
<li><strong>Straight lines and sharp points receive no credit</strong></li>
</ul>

<header>Topographic Mapping</header>

<h1 id="contour-lines-over-a-stream">Contour lines over a stream</h1>
<ul>
<li>Contour lines <strong>bend</strong> where they cross a stream</li>
<li>The bend makes a <strong>&quot;V&quot; that points upstream</strong></li>
<li>Water flows <strong>downhill</strong>, so the stream flows <strong>opposite</strong> the direction the V points</li>
<li>Streams run from <strong>high</strong> elevation toward <strong>low</strong> elevation</li>
</ul>
<p><img src="images/stream-contours.png" alt="" style="width:520px;" /></p>

ul, ol { line-height: 1.55; }
img { border-radius: 6px; }
blockquote {
  background: #eaf3f6;
  border-left: 6px solid #1d6b84;
  border-top: none; border-right: none; border-bottom: none;
  padding: 12px 22px;
  margin-top: 0.4em;
  font-size: 25px;
}
blockquote::before, blockquote::after { content: none; }

/* two-column slides: each top-level block becomes a grid cell */
section.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 38px;
  align-content: center;
}
section.split &gt; h1, section.split &gt; h2, section.split &gt; blockquote { grid-column: 1 / -1; }
section.split &gt; * { align-self: center; }
section.wide { grid-template-columns: 1.15fr 1fr; }
section.narrow { grid-template-columns: 1fr 1.25fr; }

section.lead {
  background: #123240;
  color: #f4f9fb;
  justify-content: center;
  text-align: center;
}
section.lead h1 { color: #ffffff; font-size: 66px; margin-bottom: 0.1em; }
section.lead h2 { color: #7fc7d9; font-weight: 400; font-size: 30px; }

section::after { color: #7a8b93; font-size: 18px; }
strong { color: #b5451b; }
ul, ol { line-height: 1.55; }
img { border-radius: 6px; }
blockquote {
  background: #eaf3f6;
  border-left: 6px solid #1d6b84;
  border-top: none; border-right: none; border-bottom: none;
  padding: 12px 22px;
  margin-top: 0.4em;
  font-size: 25px;
}
blockquote::before, blockquote::after { content: none; }

/* two-column slides: each top-level block becomes a grid cell */
section.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 38px;
  align-content: center;
}
section.split &gt; h1, section.split &gt; h2, section.split &gt; blockquote { grid-column: 1 / -1; }
section.split &gt; * { align-self: center; }
section.wide { grid-template-columns: 1.15fr 1fr; }
section.narrow { grid-template-columns: 1fr 1.25fr; }

section.lead {
  background: #123240;
  color: #f4f9fb;
  justify-content: center;
  text-align: center;
}
section.lead h1 { color: #ffffff; font-size: 66px; margin-bottom: 0.1em; }
section.lead h2 { color: #7fc7d9; font-weight: 400; font-size: 30px; }
