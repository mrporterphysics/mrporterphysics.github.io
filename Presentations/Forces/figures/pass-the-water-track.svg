<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The Pass the Water relay track</title>
  <desc>An oval relay track with two straightaways and two turns. The start, finish and refill line sits on the bottom straightaway. Three moments are numbered: the hand-off at the line, the straightaways, and the turns. The observer's job is to mark where water goes over the rim and what the dish was doing at that moment.</desc>

  <rect width="1200" height="620" fill="#FFFCF0"/>

  <!-- ===== the track ===== -->
  <path d="M 240 140 H 740 A 160 160 0 0 1 740 460 H 240 A 160 160 0 0 1 240 140 Z"
        fill="none" stroke="#DAD8CE" stroke-width="58"/>
  <path d="M 240 140 H 740 A 160 160 0 0 1 740 460 H 240 A 160 160 0 0 1 240 140 Z"
        fill="none" stroke="#B7B5AC" stroke-width="2" stroke-dasharray="10 13"/>

  <!-- direction of travel -->
  <g fill="#B7B5AC">
    <g transform="translate(420,140)"><path d="M -9 -8 L 9 0 L -9 8 Z"/></g>
    <g transform="translate(853,187) rotate(45)"><path d="M -9 -8 L 9 0 L -9 8 Z"/></g>
    <g transform="translate(380,460) rotate(180)"><path d="M -9 -8 L 9 0 L -9 8 Z"/></g>
    <g transform="translate(127,413) rotate(225)"><path d="M -9 -8 L 9 0 L -9 8 Z"/></g>
    <g transform="translate(127,187) rotate(-45)"><path d="M -9 -8 L 9 0 L -9 8 Z"/></g>
  </g>

  <!-- start / finish / refill line -->
  <line x1="520" y1="431" x2="520" y2="489" stroke="#100F0F" stroke-width="5"/>
  <text x="520" y="416" font-size="17" font-weight="700" fill="#100F0F" text-anchor="middle" letter-spacing="1.4">START · FINISH · REFILL</text>

  <!-- ===== numbered markers ===== -->
  <g font-size="19" font-weight="700" fill="#FFFCF0" text-anchor="middle">
    <circle cx="520" cy="460" r="16" fill="#205EA6" stroke="#FFFCF0" stroke-width="2.5"/>
    <text x="520" y="467">1</text>
    <circle cx="490" cy="140" r="16" fill="#66800B" stroke="#FFFCF0" stroke-width="2.5"/>
    <text x="490" y="147">2</text>
    <circle cx="853" cy="187" r="16" fill="#BC5215" stroke="#FFFCF0" stroke-width="2.5"/>
    <text x="853" y="194">3</text>
  </g>

  <!-- leaders -->
  <g stroke="#B7B5AC" stroke-width="2">
    <line x1="520" y1="478" x2="520" y2="508"/>
    <line x1="490" y1="122" x2="490" y2="98"/>
    <line x1="869" y1="197" x2="950" y2="252"/>
  </g>

  <!-- ===== callout 2 — the straightaways ===== -->
  <rect x="258" y="14" width="474" height="84" rx="5" fill="#F2F0E5" stroke="#CECDC3" stroke-width="2"/>
  <rect x="258" y="14" width="8" height="84" fill="#66800B"/>
  <text x="284" y="46" font-size="21" font-weight="700" fill="#66800B">2 · The straightaways</text>
  <text x="284" y="78" font-size="19" fill="#100F0F">One steady walking pace, in a straight line.</text>

  <!-- ===== callout 3 — the turns ===== -->
  <rect x="950" y="236" width="240" height="128" rx="5" fill="#F2F0E5" stroke="#CECDC3" stroke-width="2"/>
  <rect x="950" y="236" width="8" height="128" fill="#BC5215"/>
  <text x="976" y="268" font-size="21" font-weight="700" fill="#BC5215">3 · The turns</text>
  <text x="976" y="300" font-size="19" fill="#100F0F">Same pace the whole</text>
  <text x="976" y="324" font-size="19" fill="#100F0F">way round — but a</text>
  <text x="976" y="348" font-size="19" font-weight="700" fill="#100F0F">new direction.</text>

  <!-- ===== callout 1 — the hand-off ===== -->
  <rect x="282" y="508" width="476" height="90" rx="5" fill="#F2F0E5" stroke="#CECDC3" stroke-width="2"/>
  <rect x="282" y="508" width="8" height="90" fill="#205EA6"/>
  <text x="308" y="540" font-size="21" font-weight="700" fill="#205EA6">1 · The hand-off</text>
  <text x="308" y="572" font-size="19" fill="#100F0F">One runner <tspan font-weight="700">stops</tspan> at the line; the next <tspan font-weight="700">starts from rest</tspan>.</text>

  <!-- ===== the observer's job, inside the oval ===== -->
  <rect x="320" y="232" width="540" height="140" rx="5" fill="#FFFCF0" stroke="#AD8301" stroke-width="2.5"/>
  <rect x="320" y="232" width="9" height="140" fill="#AD8301"/>
  <text x="348" y="266" font-size="21" font-weight="700" fill="#AD8301">Your job as observer</text>
  <text x="348" y="300" font-size="19" fill="#100F0F">Mark <tspan font-weight="700" font-size="22">×</tspan> on your track sketch wherever the water goes</text>
  <text x="348" y="326" font-size="19" fill="#100F0F">over the rim — and write down <tspan font-weight="700">what the dish was</tspan></text>
  <text x="348" y="352" font-size="19" fill="#100F0F"><tspan font-weight="700">doing</tspan> at that moment.</text>
</svg>
