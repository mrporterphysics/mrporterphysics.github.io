<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Friction opposes relative motion, not the applied force</title>
  <desc>Two cases. In the first a block slides right while a push acts right, and friction acts left. In the second the block still slides right while the push acts left and is slowing it, and friction still acts left. Friction is set by the direction of sliding, not by the push.</desc>

  <defs>
    <marker id="fApp" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#BC5215"/></marker>
    <marker id="fFric" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#AF3029"/></marker>
    <marker id="fVel" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#100F0F"/></marker>
  </defs>

  <rect width="1160" height="580" fill="#FFFCF0"/>

  <!-- ===== CASE A ===== -->
  <g transform="translate(0,0)">
    <text x="60" y="56" font-size="24" font-weight="700" fill="#100F0F">Case A — the push speeds it up</text>

    <!-- velocity, well above the block -->
    <line x1="300" y1="118" x2="440" y2="118" stroke="#100F0F" stroke-width="5" stroke-linecap="round" marker-end="url(#fVel)"/>
    <text x="450" y="126" font-size="22" font-weight="700" fill="#100F0F">v</text>

    <!-- block -->
    <rect x="240" y="188" width="130" height="90" rx="5" fill="#F2F0E5" stroke="#100F0F" stroke-width="3.5"/>

    <!-- rough surface -->
    <path d="M 60 278 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15"
          fill="none" stroke="#6F6E69" stroke-width="3"/>
    <rect x="60" y="278" width="440" height="42" fill="#E6E4D9"/>

    <!-- applied force, right -->
    <line x1="370" y1="233" x2="488" y2="233" stroke="#BC5215" stroke-width="7" stroke-linecap="round" marker-end="url(#fApp)"/>
    <text x="408" y="218" font-size="20" font-weight="700" fill="#BC5215">F<tspan font-size="14" dy="5">app</tspan></text>

    <!-- friction, left -->
    <line x1="240" y1="233" x2="140" y2="233" stroke="#AF3029" stroke-width="7" stroke-linecap="round" marker-end="url(#fFric)"/>
    <text x="152" y="218" font-size="20" font-weight="700" fill="#AF3029">F<tspan font-size="16" dy="5">f</tspan></text>

    <text x="60" y="372" font-size="20" fill="#6F6E69">Push right, sliding right.</text>
    <text x="60" y="402" font-size="21" font-weight="700" fill="#AF3029">Friction points left.</text>
  </g>

  <!-- divider -->
  <line x1="580" y1="40" x2="580" y2="420" stroke="#CECDC3" stroke-width="2.5"/>

  <!-- ===== CASE B ===== -->
  <g transform="translate(600,0)">
    <text x="60" y="56" font-size="24" font-weight="700" fill="#100F0F">Case B — the push slows it down</text>

    <!-- SAME velocity, still right -->
    <line x1="300" y1="118" x2="440" y2="118" stroke="#100F0F" stroke-width="5" stroke-linecap="round" marker-end="url(#fVel)"/>
    <text x="450" y="126" font-size="22" font-weight="700" fill="#100F0F">v</text>

    <rect x="280" y="188" width="130" height="90" rx="5" fill="#F2F0E5" stroke="#100F0F" stroke-width="3.5"/>

    <path d="M 60 278 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15 l 20 -15 l 20 15"
          fill="none" stroke="#6F6E69" stroke-width="3"/>
    <rect x="60" y="278" width="440" height="42" fill="#E6E4D9"/>

    <!-- friction, left, on the upper line -->
    <line x1="280" y1="214" x2="180" y2="214" stroke="#AF3029" stroke-width="7" stroke-linecap="round" marker-end="url(#fFric)"/>
    <text x="192" y="200" font-size="20" font-weight="700" fill="#AF3029">F<tspan font-size="16" dy="5">f</tspan></text>

    <!-- applied force, also left, on the lower line -->
    <line x1="280" y1="256" x2="150" y2="256" stroke="#BC5215" stroke-width="7" stroke-linecap="round" marker-end="url(#fApp)"/>
    <text x="162" y="290" font-size="20" font-weight="700" fill="#BC5215">F<tspan font-size="14" dy="5">app</tspan></text>

    <text x="60" y="372" font-size="20" fill="#6F6E69">Push left, still sliding right.</text>
    <text x="60" y="402" font-size="21" font-weight="700" fill="#AF3029">Friction still points left.</text>
  </g>

  <!-- the rule -->
  <rect x="60" y="446" width="1040" height="104" rx="5" fill="#66800B" opacity="0.08"/>
  <rect x="60" y="446" width="9" height="104" fill="#66800B"/>
  <text x="92" y="486" font-size="24" font-weight="700" fill="#66800B">Friction is set by the sliding, not by the push.</text>
  <text x="92" y="524" font-size="21" fill="#100F0F">Kinetic friction always points <tspan font-weight="700">opposite the relative motion of the surfaces</tspan> — ask which way it slides first.</text>
</svg>
