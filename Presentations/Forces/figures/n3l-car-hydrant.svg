<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>A car presses against a fire hydrant</title>
  <desc>Side view of a car whose front bumper touches a fire hydrant. The driver is pressing hard but nothing moves. No forces are drawn: students vote on how the two forces compare.</desc>
  <rect width="1200" height="500" fill="#FFFCF0"/>
  <line x1="60" y1="420" x2="1140" y2="420" stroke="#100F0F" stroke-width="4"/>
  <path d="M250 380 L250 300 Q252 280 280 278 L400 275 L460 205 L640 205 L705 275 L770 282 Q792 286 792 310 L792 380 Z" fill="#F2F0E5" stroke="#100F0F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M480 220 L620 220 L670 270 L430 270 Z" fill="#FFFCF0" stroke="#100F0F" stroke-width="3" stroke-linejoin="round"/>
  <line x1="550" y1="220" x2="550" y2="270" stroke="#100F0F" stroke-width="3"/>
  <circle cx="345" cy="380" r="40" fill="#100F0F"/><circle cx="345" cy="380" r="16" fill="#CECDC3"/>
  <circle cx="690" cy="380" r="40" fill="#100F0F"/><circle cx="690" cy="380" r="16" fill="#CECDC3"/>
  <rect x="784" y="312" width="16" height="44" rx="4" fill="#6F6E69" stroke="#100F0F" stroke-width="3"/>
  <rect x="800" y="270" width="72" height="150" rx="8" fill="#AF3029" stroke="#100F0F" stroke-width="4"/>
  <path d="M794 270 Q836 215 878 270 Z" fill="#AF3029" stroke="#100F0F" stroke-width="4"/>
  <rect x="822" y="210" width="28" height="16" rx="3" fill="#AF3029" stroke="#100F0F" stroke-width="3"/>
  <rect x="872" y="308" width="26" height="34" rx="4" fill="#AF3029" stroke="#100F0F" stroke-width="3"/>
  <rect x="790" y="406" width="92" height="14" fill="#100F0F"/>
  <circle cx="800" cy="334" r="7" fill="#100F0F"/>
<text x="520" y="464" text-anchor="middle" font-size="24" font-weight="600" fill="#6F6E69">car</text>
<text x="836" y="464" text-anchor="middle" font-size="24" font-weight="600" fill="#6F6E69">hydrant</text>
<text x="960" y="300" text-anchor="start" font-size="24" font-weight="700" fill="#100F0F">The car is pressing hard.</text>
<text x="960" y="334" text-anchor="start" font-size="24" font-weight="700" fill="#100F0F">Nothing moves.</text>
</svg>
